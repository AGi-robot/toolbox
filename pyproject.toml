[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agi-toolbox"
version = "0.1.0"
description = "Shared utilities for AIVA"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
lighting = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "openrgb-python>=0.3.8,<0.4"]

[project.scripts]
aiva-lighting = "agi_toolbox.lighting_server:main"

[tool.setuptools.package-data]
agi_toolbox = ["lighting_catalog.md"]

[tool.setuptools.packages.find]
where = ["src"]
