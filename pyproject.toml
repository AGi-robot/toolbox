[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agi-toolbox"
version = "0.1.0"
description = "Shared utilities for Grace"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}

[tool.setuptools.packages.find]
where = ["src"]
